name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pip-audit
      - run: python -m pytest -q
      # chromadb has no fixed release for these advisories. All four are in Chroma's HTTP
      # server (/api/v2 endpoints, RBAC provider); the app only embeds chromadb.PersistentClient
      # and never runs or exposes a Chroma server. Revisit when a patched chromadb ships.
      # PYSEC-2026-311 (GHSA-f4j7-r4q5-qw2c), PYSEC-2026-3814 (GHSA-36p7-vc44-83pf),
      # PYSEC-2026-3815 (GHSA-xph7-9rjv-w5fr), PYSEC-2026-3813 (GHSA-2wm9-hf6c-p5cr)
      - run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815 --ignore-vuln PYSEC-2026-3813
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend audit --omit=dev --audit-level=high
